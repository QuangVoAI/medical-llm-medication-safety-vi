stage: sft
model_name: Qwen/Qwen2.5-7B-Instruct
dataset_path: data/processed/medication_safety_vi_sft.jsonl
method: qlora
load_in_4bit: true
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
training:
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_seq_length: 768
  logging_steps: 1
  save_strategy: epoch
  gradient_checkpointing: true
  max_grad_norm: 1.0
  optim: paged_adamw_8bit
precision:
  fp16: true
  bf16: false
notes:
  - Main Kaggle training config if T4 or better is stable.
  - Reduce max_seq_length to 512 first if OOM occurs.
