stage: dpo
base_adapter: outputs/models/qwen25_7b_sft
model_name: Qwen/Qwen2.5-7B-Instruct
dataset_path: data/processed/medication_safety_vi_dpo.jsonl
method: qlora
load_in_4bit: true
lora:
  r: 16
  alpha: 32
  dropout: 0.05
training:
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  weight_decay: 0.0
  max_length: 768
  max_prompt_length: 256
  logging_steps: 1
  save_strategy: epoch
  gradient_checkpointing: true
  max_grad_norm: 1.0
  optim: paged_adamw_8bit
dpo:
  beta: 0.1
precision:
  fp16: true
  bf16: false
notes:
  - Start from the SFT adapter.
  - Lower learning_rate to 3e-6 if DPO loss oscillates too much.
